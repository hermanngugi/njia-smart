name: Temporary package lock repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up the matching Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm

      - name: Use the same npm version as the verified clean install
        run: npm install --global npm@11.19.1

      - name: Regenerate the lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify manifest and lockfile declarations match
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          if (!root) throw new Error('Lockfile is missing its root package entry');
          for (const group of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            const a = pkg[group] ?? {};
            const b = root[group] ?? {};
            const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
            for (const name of keys) {
              if (a[name] !== b[name]) {
                throw new Error(group + ' mismatch for ' + name + ': package.json=' + a[name] + ', lock=' + b[name]);
              }
            }
          }
          console.log('package.json and package-lock.json declarations match.');
          NODE

      - name: Verify a clean deterministic installation
        run: npm ci --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Commit only package-lock.json
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The committed lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update npm package lockfile"
          git push origin HEAD:main
